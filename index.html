}

}

// =======================
// USE ITEMS
// =======================

const useItems = [
"Skilltrainer Animals","Skilltrainer Artistic","Skilltrainer Construction",
"Skilltrainer Cooking","Skilltrainer Crafting","Skilltrainer Intellectual",
"Skilltrainer Medical","Skilltrainer Melee","Skilltrainer Mining",
"Skilltrainer Plants","Skilltrainer Shooting","Skilltrainer Social"
];

// =======================
// EVENTS (FULL CORE SET)
// =======================

const events = [
"Acidic Smog","Alpha Beavers","Ambrosia Sprout","Aurora",
"Cold Snap","Heat Wave","Flashstorm","Solar Flare","Infestation",
"Manhunter Pack","Psychic Drone","Psychic Soothe",
"Raid","Transport Pod Crash","Beggars Arrive","Caravan Arrival"
];

// =======================
// TRAITS
// =======================

const traits = [
"Abrasive","Beautiful","Ugly","Bloodlust","Kind","Psychopath",
"Pyromaniac","Tough","Wimp","Fast Learner","Lazy","Industrious",
"Greedy","Jealous","Sanguine","Depressive","Neurotic"
];

// =======================
// PAWN OPTIONS
// =======================

const race = ["Human"];
const xeno = ["Baseliner","Hybrid","Dirtmole","Genie","Highmate","Hussar","Impid","Neanderthal","Pigskin","Waster"];
const sex = ["Male","Female"];
const age = Array.from({length: 50}, (_,i)=> (18+i).toString());

// =======================
// INIT
// =======================

const cmdSelect = document.getElementById("command");
commands.forEach(c=>{
    let o=document.createElement("option");
    o.value=c;
    o.textContent=c;
    cmdSelect.appendChild(o);
});

cmdSelect.addEventListener("change", buildUI);

// =======================
// BUILD UI
// =======================

function buildUI(){
    const val = cmdSelect.value;
    const container = document.getElementById("dynamic");
    container.innerHTML="";

    if (["!buy","!lookup","!pricecheck"].includes(val)){
        container.appendChild(makeSelect("secondary",items));
    }
    else if (val==="!event"){
        container.appendChild(makeSelect("secondary",events));
    }
    else if (val==="!use"){
        container.appendChild(makeSelect("secondary",useItems));
    }
    else if (["!addtrait","!removetrait"].includes(val)){
        container.appendChild(makeSelect("secondary",traits));
    }    
    else if (val==="!replacetrait"){
        container.appendChild(makeSelect("secondary",traits));
        container.appendChild(makeSelect("third",traits));
        
    }
    else if (val==="!pawn"){
        container.appendChild(makeSelect("race",race));
        container.appendChild(makeSelect("xeno",xeno));
        container.appendChild(makeSelect("sex",sex));
        container.appendChild(makeSelect("age",age));
    }
}

// =======================
// DROPDOWN BUILDER
// =======================

function makeSelect(id,list){
    const s=document.createElement("select");
    s.id=id;

    let d=document.createElement("option");
    d.text="Select...";
    d.value="";
    s.appendChild(d);

    list.forEach(i=>{
        let o=document.createElement("option");
        o.value=i;
        o.textContent=i;
        s.appendChild(o);
    });

    return s;
}

// =======================
// GENERATE
// =======================

function generate(){

    let cmd = cmdSelect.value;
    let result = cmd;

    const sec = document.getElementById("secondary");
    if(sec) result += " " + sec.value;

    if(cmd==="!pawn"){
        result += " " +
        document.getElementById("race").value + " " +
        document.getElementById("xeno").value + " " +
        document.getElementById("sex").value + " " +
        document.getElementById("age").value;
    }

    document.getElementById("output").innerText = result;
}

</script>

</body>
</html>
