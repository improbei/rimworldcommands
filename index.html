<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Generator</title>
<style>
body { font-family: Arial; padding: 20px; }
select, input { width: 300px; margin: 5px 0; padding: 6px; }
button { padding: 8px 12px; margin-top: 10px; }
</style>
</head>
<body>
<h2>Command Generator</h2>

<label>Command:</label><br>
<input list="commands" id="commandInput" oninput="handleCommand()">
<datalist id="commands"></datalist>
<div id="description"></div>

<div id="dynamicFields"></div>

<br>
<button onclick="generateCommand()">Generate</button>
<button onclick="copyCommand()">Copy</button>

<p id="output"></p>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
let data = {};

fetch('rimworld_master_full(4).xlsx')
.then(res => res.arrayBuffer())
.then(buffer => {
    const workbook = XLSX.read(buffer);
    workbook.SheetNames.forEach(name => {
        data[name] = XLSX.utils.sheet_to_json(workbook.Sheets[name], {header:1});
    });

    populateCommands();
});

function populateCommands(){
    let commands = data['Commands'];
    let list = document.getElementById('commands');
    commands.forEach(row => {
        if(row[0]){
            let opt = document.createElement('option');
            opt.value = row[0];
            list.appendChild(opt);
        }
</html>
