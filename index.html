<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Command Generator</title>

<style>
body {
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    padding: 20px;
}
.container {
    max-width: 750px;
    margin: auto;
}
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    background: #1a1a1a;
    color: white;
    border: 1px solid #333;
}
button {
    width: 100%;
    padding: 12px;
    background: #22c55e;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
.output {
    background: #1a1a1a;
    padding: 15px;
    margin-top: 15px;
    border: 1px solid #333;
}
</style>
</head>

<body>

<div class="container">

<h2>Command Generator</h2>

<input list="commands" id="commandInput" placeholder="Select Command">
<datalist id="commands"></datalist>

<div id="description"></div>
<div id="dynamic"></div>

<div class="output" id="result"></div>

<button onclick="copyCommand()">Copy Command</button>

</div>

<script>
let data = {};
let commandDescriptions = {};

// Normalize command (removes spaces issues)
function normalize(cmd) {
    return cmd.replace("!", "").replace(/\s+/g, "").toLowerCase();
}

fetch("data.json")
.then(res => res.json())
.then(json => {
    data = json;

    for (let i = 0; i < data.commands.length; i += 2) {
        let raw = data.commands[i];
        let desc = data.commands[i + 1];

        let clean = normalize(raw);
        commandDescriptions[clean] = desc;

        let option = document.createElement("option");
        option.value = clean;
        document.getElementById("commands").appendChild(option);
    }
})
.catch(err => {
    console.error("DATA LOAD FAILED:", err);
    alert("Failed to load data.json");
});

document.getElementById("commandInput").addEventListener("input", buildUI);

function createInput(id, list) {
    const input = document.createElement("input");
    input.setAttribute("list", id);
    input.placeholder = id;

    const datalist = document.createElement("datalist");
    datalist.id = id;

    list.forEach(item => {
        let option = document.createElement("option");
        option.value = item;
        datalist.appendChild(option);
    });

    document.getElementById("dynamic").appendChild(input);
    document.getElementById("dynamic").appendChild(datalist);
}

function buildUI() {
    const rawCmd = document.getElementById("commandInput").value;
    const cmd = normalize(rawCmd);

    const dynamic = document.getElementById("dynamic");
    dynamic.innerHTML = "";

    document.getElementById("description").innerText =
        commandDescriptions[cmd] || "";

    if (cmd === "addtrait" || cmd === "removetrait") {
        createInput("trait", data.traits);
    }

    if (cmd === "replacetrait") {
        createInput("trait1", data.traits);
        createInput("trait2", data.traits);
    }

    if (cmd === "settraits") {
        createInput("trait1", data.traits);
        createInput("trait2", data.traits);
        createInput("trait3", data.traits);
        createInput("trait4", data.traits);
        createInput("trait5", data.traits);
        createInput("trait6", data.traits);
    }
    
    if (cmd === "buy") {
        createInput("item", data.items || []);
    }

    if (cmd === "trait") {
    createInput("trait", data.traits);
    }
    
    if (cmd === "equip") {
        createInput("equip", data["equip items"] || []);
        createInput("quality", data.quality);
    }

    if (cmd === "event") {
        createInput("event", data.events || []);
    }

    if (cmd === "lookup") {
        let combined = [
            ...(data.items || []),
            ...(data["wear items"] || []),
            ...(data["equip items"] || []),
            ...(data["use items"] || [])
        ];
        createInput("lookup", combined);
    }

    if (cmd === "pawn") {
        createInput("race", data.race);
        createInput("sex", data.sex);
        createInput("age", data.age);
    }

    if (cmd === "use") {
        createInput("use", data["use items"] || []);
    }

    if (cmd === "surgery") {
        createInput("surgery", data.surgery);
    }

    if (cmd === "wear") {
        createInput("wear", data["wear items"] || []);
        createInput("material", data.material || []);
        createInput("quality", data.quality);
    }

    generateCommand();
}

document.addEventListener("input", generateCommand);

function generateCommand() {
    const rawCmd = document.getElementById("commandInput").value;
    const cmd = normalize(rawCmd);

    const inputs = document.querySelectorAll("#dynamic input");

    let values = Array.from(inputs)
        .map(i => i.value)
        .filter(v => v);

    document.getElementById("result").textContent =
        cmd ? "!" + cmd + " " + values.join(" ") : "";
}

function copyCommand() {
    navigator.clipboard.writeText(document.getElementById("result").textContent);
    alert("Copied!");
}
</script>

</body>
</html>
